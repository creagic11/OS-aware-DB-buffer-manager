# Example configuration for bench_runner / bufferscope (--config=configs/example.conf).
# Keys are the command-line flag names without the leading "--".
# Explicit command-line flags override anything set here.

# storage engine
io_mode    = direct         # buffered | direct
pool-mb    = 64             # buffer-pool size (MiB of 4 KiB frames)
replacer   = clock          # clock | lru
durability = sync           # off | sync | group

# workload (bench_runner only)
pattern    = hotspot        # sequential | uniform | zipf | hotspot
hot-keys   = 0.2
hot-ops    = 0.8
read-pct   = 80
keys       = 200000
ops        = 100000
value-size = 100
seed       = 42
cache      = warm           # warm | oswarm | cold
runs       = 5
